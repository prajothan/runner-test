name: build deployment
on:
  push:
    branches:
      - '*'
    name: build deployment
jobs: 
  #building .war file in cloud
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        java-version: '17'
        distribution: 'adopt'
    - name: Build with Maven
      run: |
        pwd
        chmod +x mvnw
        ./mvnw clean package -Dmaven.test.skip
    #uploading war file into artifact - later it can be used in next job
    - name: Upload artifact
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: output-war
        path: target/testrunner-0.0.1-SNAPSHOT.war
    - name: Print artifact digest
      run: |
        echo "Artifact digest: ${{ steps.upload.outputs.artifact-digest }}"
  local-job:
    runs-on: [self-hosted]
    #will work only if previous build job - success
    needs: build
    if: github.ref == 'refs/heads/main'

    env:
      WAR_PATH: C:\prajoth\test-runner-service-wrapper\testrunner-0.0.1-SNAPSHOT.war
      EXPECTED_DIGEST: ${{ needs.build.outputs.artifact-digest }}
      
    steps:
      - name: example
        run: echo "Hello runner test"
      #downloading artifact from previous build job
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: output-war
          #storing .war file into local system folder
          path: C:\prajoth\test-runner-service-wrapper
      - name: Validate digest checksum
        shell: cmd
        run: |
          echo.
          echo === Digest Validation ===
          echo Expected (from build): %EXPECTED_DIGEST%
          echo.
