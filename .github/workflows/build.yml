name: build deployment
on:
  push:
    branches:
      - '*'
    name: build deployment
jobs:
  # Building .war file in cloud
  build:
    runs-on: ubuntu-latest
    outputs:
        artifact-digest: ${{ steps.checksum.outputs.war-sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Build with Maven
        run: |
          pwd
          chmod +x mvnw
          ./mvnw clean package -Dmaven.test.skip

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # Private key is read directly from the GitHub secret via env:// —
      # it is never written to disk.
      - name: Sign WAR with Cosign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign-blob \
            --key env://COSIGN_PRIVATE_KEY \
            --output-signature target/testrunner-0.0.1-SNAPSHOT.war.sig \
            --tlog-upload=false \
            target/testrunner-0.0.1-SNAPSHOT.war
          echo "WAR signed successfully."

      - name: Compute SHA256 of .war before upload
        id: checksum
        run: |
          WAR=target/testrunner-0.0.1-SNAPSHOT.war.sig
          HASH=$(sha256sum "$WAR" | awk '{print $1}')
          echo "war-sha256=${HASH}" >> "$GITHUB_OUTPUT"
          echo "Computed SHA256: ${HASH}"

      # Upload .war and its detached signature as separate artifacts
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: output-war
          path: target/testrunner-0.0.1-SNAPSHOT.war

      - name: Upload WAR signature artifact
        uses: actions/upload-artifact@v4
        with:
          name: output-war-sig
          path: target/testrunner-0.0.1-SNAPSHOT.war.sig

      - name: Print artifact digest
        run: |
          echo "Artifact digest: ${{ steps.checksum.outputs.war-sha256 }}"

  local-job:
    runs-on: [self-hosted]
    needs: build
    if: github.ref == 'refs/heads/main'

    env:
      TEMP_DIR: C:\prajoth\test-runner-service-wrapper\Temp
      WAR_PATH: C:\prajoth\test-runner-service-wrapper\Temp\testrunner-0.0.1-SNAPSHOT.war
      SIG_PATH: C:\prajoth\test-runner-service-wrapper\Temp\testrunner-0.0.1-SNAPSHOT.war.sig
      # Public key must be pre-placed on the self-hosted runner at this path.
      COSIGN_PUBLIC_KEY: C:\prajoth\cosign.pub
      EXPECTED_DIGEST: ${{ needs.build.outputs.artifact-digest }}

    steps:
      - name: example
        run: echo "Hello runner test"

      # Download .war from the build job
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: output-war
          path: C:\prajoth\test-runner-service-wrapper\Temp

      # Download the detached Cosign signature
      - name: Download WAR signature artifact
        uses: actions/download-artifact@v4
        with:
          name: output-war-sig
          path: C:\prajoth\test-runner-service-wrapper\Temp

      - name: Validate digest checksum
        shell: cmd
        run: |
          echo.
          echo === Digest Validation ===
          echo Expected (from build): %EXPECTED_DIGEST%
          echo.

          :: Strip the "sha256:" prefix → keep only the hex hash
          set EXPECTED_HASH=%EXPECTED_DIGEST:sha256:=%

          :: Compute SHA256 of the downloaded .war using certutil
          :: certutil output format:
          ::   SHA256 hash of <file>:
          ::   <hex-hash>
          ::   CertUtil: -hashfile command completed successfully.
          for /f "skip=1 tokens=1" %%H in (
            'certutil -hashfile "%SIG_PATH%" SHA256'
          ) do (
            if not defined ACTUAL_HASH set ACTUAL_HASH=%%H
          )

          echo Expected hash : %EXPECTED_HASH%
          echo Actual hash   : %ACTUAL_HASH%
          echo.

          if /i "%ACTUAL_HASH%"=="%EXPECTED_HASH%" (
            echo [PASS] Checksum validation passed. Artifact is intact.
          ) else (
            echo [FAIL] Checksum mismatch! Deleting corrupted file.
            del /f /q "%SIG_PATH%"
            exit /b 1
          )

      # Verify the .war against its signature using the local public key.
      # cosign must be installed on the self-hosted runner
      # (e.g. place cosign.exe in C:\prajoth\ or on the system PATH).
      - name: Verify Cosign signature
        shell: cmd
        run: |
          echo.
          echo === Cosign Signature Verification ===
          echo WAR     : %WAR_PATH%
          echo Sig     : %SIG_PATH%
          echo Pub key : %COSIGN_PUBLIC_KEY%
          echo.

          cosign verify-blob ^
            --key "%COSIGN_PUBLIC_KEY%" ^
            --signature "%SIG_PATH%" ^
            --insecure-ignore-tlog ^
            "%WAR_PATH%"

          if %ERRORLEVEL% neq 0 (
            echo [FAIL] Signature verification failed! Removing untrusted files.
            del /f /q "%WAR_PATH%"
            del /f /q "%SIG_PATH%"
            exit /b 1
          )
          echo [PASS] Signature verification passed. Artifact is authentic.

      - name: Move WAR to deployment folder
        shell: cmd
        run: |
          move "%SIG_PATH%" "C:\prajoth\test-runner-service-wrapper\testrunner-0.0.1-SNAPSHOT.war.sig"

      # Check Windows service presence and restart
      - name: Manage TestRunner Windows service
        run: |
          $serviceName = "TestRunner"
          $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
          if ($service) {
            if ($service.Status -eq 'Running') {
              C:\prajoth\test-runner-service-wrapper\test-runner-service-wrapper.exe stop
              sleep 15
            }
            C:\prajoth\test-runner-service-wrapper\test-runner-service-wrapper.exe uninstall
          }
          C:\prajoth\test-runner-service-wrapper\test-runner-service-wrapper.exe install
          C:\prajoth\test-runner-service-wrapper\test-runner-service-wrapper.exe start
