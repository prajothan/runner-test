name: Generate cosign key pair (run once)
on:
  workflow_dispatch:
jobs:
  generate-keys:
    runs-on: ubuntu-latest

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate key pair
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign generate-key-pair
          # cosign.key and cosign.pub are now in the working directory

      - name: Store keys as GitHub secrets
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh secret set COSIGN_PRIVATE_KEY --repo ${{ github.repository }} < cosign.key
          gh secret set COSIGN_PUBLIC_KEY  --repo ${{ github.repository }} < cosign.pub
          rm -f cosign.key cosign.pub
          echo "Keys stored and deleted from runner."
