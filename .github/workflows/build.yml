name: Generate cosign key pair (run once)
on:
  workflow_dispatch:

jobs:
  generate-keys:
    runs-on: ubuntu-latest

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate key pair and print
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign generate-key-pair

          echo ""
          echo "========== COPY BELOW INTO GitHub Secrets =========="
          echo ""
          echo "--- Secret name: COSIGN_PRIVATE_KEY ---"
          cat cosign.key
          echo ""
          echo "--- Secret name: COSIGN_PUBLIC_KEY ---"
          cat cosign.pub
          echo ""
          echo "===================================================="

          rm -f cosign.key cosign.pub
